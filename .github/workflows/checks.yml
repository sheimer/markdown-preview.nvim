name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    name: ${{ matrix.os }} / Neovim ${{ matrix.neovim }} / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Keep OS releases compatible with the locked Playwright distribution.
        # ubuntu-latest moved to 26.04 before Playwright 1.56 supported it.
        # Intel avoids the reported macOS ARM64 runner-capacity constraint.
        # Local ARM64 acceptance remains recorded separately in validation.md.
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
        neovim: [v0.12.2, v0.12.6]
        browser: [chromium, firefox]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin with spaces
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: plugin with spaces/package-lock.json
      - uses: rhysd/action-setup-vim@v1
        id: neovim
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - run: npm install --global npm@11.10.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test -- --report-dir test-results
        env:
          NVIM: ${{ steps.neovim.outputs.executable }}
          MKDP_TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: checks-${{ matrix.os }}-${{ matrix.neovim }}-${{ matrix.browser }}
          path: plugin with spaces/test-results/
          if-no-files-found: ignore
          retention-days: 7
    defaults:
      run:
        working-directory: plugin with spaces
